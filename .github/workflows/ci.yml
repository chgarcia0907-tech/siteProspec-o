name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Formatação (prettier) fica fora do CI: o código gerado pelo Lovable não segue o prettier.
      - name: Lint
        run: bun run lint:ci

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build
